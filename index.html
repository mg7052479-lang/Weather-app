<!--
Weather App — single-file HTML/CSS/JS
Features:
- Search weather by city name
- Get weather by current location (Geolocation)
- Shows current weather: temp, description, icon, humidity, wind, sunrise/sunset
- 5-day forecast (uses 12:00:00 entries from the 5-day/3-hour forecast)
- Responsive layout, accessible controls, and simple animations

Instructions:
1. Get a free API key from OpenWeatherMap: https://openweathermap.org/ (replace YOUR_API_KEY below)
2. Save this file as `index.html` and open in your browser. For geolocation and better behavior, serve it from a local server (e.g. `npx http-server` or `python -m http.server`).
3. Insert your API key where indicated.

NOTE: Replace `YOUR_API_KEY` with your OpenWeatherMap API key.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather App — Fast & Pretty</title>
  <style>
    :root{
      --bg:#0f1724; /* deep navy */
      --card:#0b1220; /* card background */
      --accent:#00b4d8; /* accent */
      --muted:#94a3b8;
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg) 0%, #071028 100%);color:#e6eef8}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
    .app{width:100%;max-width:980px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(2,6,23,0.7);backdrop-filter:blur(6px)}
    header{display:flex;align-items:center;gap:12px}
    header h1{margin:0;font-size:20px;letter-spacing:0.4px}
    .controls{display:flex;gap:10px;margin-top:14px}
    .search{flex:1;display:flex;gap:8px}
    input[type="search"]{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.05);background:transparent;color:inherit;outline:none;font-size:15px}
    button{padding:10px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),#7be0ff);color:#022;cursor:pointer;font-weight:600}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);font-weight:600}
    .main{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:18px}
    .card{background:var(--card);padding:16px;border-radius:12px}
    .current{display:flex;align-items:center;gap:16px}
    .icon{width:110px;height:110px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px}
    .temp{font-size:40px;font-weight:700}
    .meta{color:var(--muted);font-size:14px}
    .details{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .row{display:flex;justify-content:space-between}
    .forecast{display:flex;flex-direction:column;gap:8px}
    .forecast-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
    .day{padding:8px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));text-align:center}
    .small{font-size:13px;color:var(--muted)}
    footer{margin-top:12px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center}
    .loader{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* small screens */
    @media (max-width:820px){
      .main{grid-template-columns:1fr;}
      .forecast-grid{grid-template-columns:repeat(3,1fr);}
      .icon{width:80px;height:80px}
      .temp{font-size:32px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app" role="application" aria-label="Weather app">
      <header>
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0ea5e9"/><path d="M6 14c0-2.21 1.79-4 4-4h1" stroke="#022" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <h1>Weather — Quick & Pretty</h1>
          <div class="small">Powered by OpenWeatherMap • Works with city search or your location</div>
        </div>
      </header>

      <div class="controls">
        <div class="search">
          <input id="q" type="search" placeholder="Enter city (e.g. Mumbai, Tokyo)" aria-label="City name" />
          <button id="searchBtn">Search</button>
        </div>
        <button id="locBtn" class="secondary" title="Use your location">Use my location</button>
        <button id="unitBtn" class="secondary" title="Toggle units">°C</button>
      </div>

      <div class="main">
        <section class="card">
          <div id="status" class="small" aria-live="polite"></div>

          <div id="currentWrap" class="current" hidden>
            <div class="icon" id="iconWrap" aria-hidden="true"></div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:12px">
                <div>
                  <div id="city" class="meta" style="font-weight:700;font-size:18px"></div>
                  <div id="desc" class="meta"></div>
                </div>
                <div style="margin-left:auto;text-align:right">
                  <div id="temp" class="temp">--°</div>
                  <div id="feels" class="small"></div>
                </div>
              </div>

              <div class="details" id="more"></div>
            </div>
          </div>

          <div id="empty" class="small">Search a city or use your location to get the weather.</div>

        </section>

        <aside class="card">
          <div class="forecast">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:700">5-day forecast</div>
              <div id="forecastMeta" class="small">(midday snapshots)</div>
            </div>
            <div id="forecastGrid" class="forecast-grid" aria-live="polite"></div>
          </div>

          <footer>
            <div class="small">Made with ❤️ — client-only demo</div>
            <div id="footRight" class="small"></div>
          </footer>
        </aside>
      </div>
    </div>
  </div>

  <script>
    // === CONFIG ===
    const API_KEY = 'YOUR_API_KEY'; // <<--- replace with your OpenWeatherMap API key
    // === /CONFIG ===

    // DOM
    const qInput = document.getElementById('q');
    const searchBtn = document.getElementById('searchBtn');
    const locBtn = document.getElementById('locBtn');
    const unitBtn = document.getElementById('unitBtn');
    const status = document.getElementById('status');
    const currentWrap = document.getElementById('currentWrap');
    const empty = document.getElementById('empty');
    const cityEl = document.getElementById('city');
    const descEl = document.getElementById('desc');
    const tempEl = document.getElementById('temp');
    const feelsEl = document.getElementById('feels');
    const iconWrap = document.getElementById('iconWrap');
    const moreEl = document.getElementById('more');
    const forecastGrid = document.getElementById('forecastGrid');
    const footRight = document.getElementById('footRight');

    let units = 'metric'; // metric or imperial

    function setStatus(msg, busy=false){
      status.innerHTML = msg ? msg + (busy ? ' <span class="loader" aria-hidden="true"></span>' : '') : '';
    }

    function formatTime(ts, tzOffsetSeconds){
      // ts is unix seconds, tzOffsetSeconds from API
      const date = new Date((ts + tzOffsetSeconds) * 1000);
      return date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    }

    function showCurrent(data){
      empty.hidden = true;
      currentWrap.hidden = false;
      const name = data.name + ', ' + (data.sys && data.sys.country ? data.sys.country : '');
      cityEl.textContent = name;
      descEl.textContent = data.weather?.[0]?.description ?? '';
      const t = Math.round(data.main.temp);
      tempEl.textContent = t + (units === 'metric' ? '°C' : '°F');
      feelsEl.textContent = 'Feels like ' + Math.round(data.main.feels_like) + (units==='metric'?'°C':'°F');

      const icon = data.weather?.[0]?.icon;
      iconWrap.innerHTML = icon ? `<img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${data.weather[0].description}" width="80" height="80">` : '';

      const tzOffset = data.timezone || 0; // seconds
      moreEl.innerHTML = `
        <div class="row"><div class="small">Humidity</div><div class="small">${data.main.humidity}%</div></div>
        <div class="row"><div class="small">Wind</div><div class="small">${data.wind.speed} ${units==='metric'?'m/s':'mph'}</div></div>
        <div class="row"><div class="small">Sunrise</div><div class="small">${formatTime(data.sys.sunrise, tzOffset)}</div></div>
        <div class="row"><div class="small">Sunset</div><div class="small">${formatTime(data.sys.sunset, tzOffset)}</div></div>
      `;

      footRight.textContent = new Date().toLocaleString();
    }

    function showForecast(list, tzOffset){
      forecastGrid.innerHTML = '';
      // pick entries at 12:00:00 local time — API gives dt_txt in UTC; we'll choose those that include '12:00:00'
      const midday = list.filter(i => i.dt_txt && i.dt_txt.includes('12:00:00'));
      const items = midday.slice(0,5);
      if(items.length === 0){
        forecastGrid.innerHTML = '<div class="small">No forecast available</div>';
        return;
      }
      items.forEach(i => {
        const date = new Date(i.dt * 1000);
        const day = date.toLocaleDateString(undefined,{weekday:'short'});
        const icon = i.weather?.[0]?.icon;
        const desc = i.weather?.[0]?.main || '';
        const t = Math.round(i.main.temp);
        const el = document.createElement('div');
        el.className = 'day';
        el.innerHTML = `
          <div class="small">${day}</div>
          <div style="margin:8px 0"><img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${desc}" width="52" height="52"></div>
          <div style="font-weight:700">${t}°</div>
          <div class="small">${desc}</div>
        `;
        forecastGrid.appendChild(el);
      });
    }

    async function fetchByCity(q){
      try{
        setStatus('Loading...', true);
        // current
        const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(q)}&units=${units}&appid=${API_KEY}`);
        if(!curRes.ok) throw new Error('City not found');
        const cur = await curRes.json();
        showCurrent(cur);

        // forecast
        const fRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(q)}&units=${units}&appid=${API_KEY}`);
        if(fRes.ok){
          const fjson = await fRes.json();
          showForecast(fjson.list, fjson.city.timezone || 0);
        } else {
          forecastGrid.innerHTML = '<div class="small">Forecast not available</div>';
        }

        setStatus('');
      }catch(err){
        setStatus('Error: ' + err.message);
        currentWrap.hidden = true;
        empty.hidden = false;
        forecastGrid.innerHTML = '';
      }
    }

    async function fetchByCoords(lat, lon){
      try{
        setStatus('Loading...', true);
        const curRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${units}&appid=${API_KEY}`);
        if(!curRes.ok) throw new Error('Location weather not available');
        const cur = await curRes.json();
        showCurrent(cur);

        const fRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${units}&appid=${API_KEY}`);
        if(fRes.ok){
          const fjson = await fRes.json();
          showForecast(fjson.list, fjson.city.timezone || 0);
        } else {
          forecastGrid.innerHTML = '<div class="small">Forecast not available</div>';
        }

        setStatus('');
      }catch(err){
        setStatus('Error: ' + err.message);
        currentWrap.hidden = true;
        empty.hidden = false;
        forecastGrid.innerHTML = '';
      }
    }

    // events
    searchBtn.addEventListener('click', ()=>{
      const q = qInput.value.trim();
      if(!q) return setStatus('Please enter a city name');
      fetchByCity(q);
    });
    qInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') searchBtn.click(); });

    locBtn.addEventListener('click', ()=>{
      if(!navigator.geolocation) return setStatus('Geolocation not supported');
      setStatus('Getting your location...', true);
      navigator.geolocation.getCurrentPosition(pos =>{
        setStatus('Fetching weather for your location...', true);
        fetchByCoords(pos.coords.latitude, pos.coords.longitude);
      }, err => {
        setStatus('Unable to retrieve location: ' + err.message);
      }, {timeout:10000});
    });

    unitBtn.addEventListener('click', ()=>{
      units = units === 'metric' ? 'imperial' : 'metric';
      unitBtn.textContent = units === 'metric' ? '°C' : '°F';
      // if a city displayed, refresh
      const displayed = cityEl.textContent;
      if(displayed && displayed !== ''){
        const q = qInput.value.trim();
        if(q) fetchByCity(q);
      }
    });

    // helpful sample on load
    (function init(){
      // show a gentle greeting in status
      setStatus('Tip: try "Use my location" or search for a city', false);
    })();

  </script>
</body>
</html>
